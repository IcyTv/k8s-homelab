apiVersion: v1
kind: PersistentVolume
metadata:
  name: audiobookshelf-media
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - vers=3.0
    - seal
    - uid=1000
    - gid=1000
    - file_mode=0660
    - dir_mode=0770
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: "storagebox#audiobooks#backup"
    volumeAttributes:
      source: "//u689340.your-storagebox.de/backup"
      subDir: "audiobooks"
    nodeStageSecretRef:
      name: storagebox-smb
      namespace: audiobookshelf
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: audiobookshelf-media
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-metadata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
