apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-ngx-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-ngx-media
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - vers=3.0
    - seal
    - uid=1000
    - gid=1000
    - file_mode=0660
    - dir_mode=0770
    - noserverino
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: "storagebox#documents#media#backup"
    volumeAttributes:
      source: "//u689340.your-storagebox.de/backup"
      subDir: "documents/media"
    nodeStageSecretRef:
      name: storagebox-smb
      namespace: flux-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-ngx-media
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: paperless-ngx-media
  resources:
    requests:
      storage: 1Ti
---
