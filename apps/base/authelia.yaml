---
apiVersion: v1
kind: Namespace
metadata:
  name: authelia
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authelia-sa
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authelia-sa-admin
  namespace: authelia
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: authelia-sa
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: authelia
  namespace: flux-system
spec:
  dependsOn:
    - name: base
    - name: lldap
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: authelia
      namespace: authelia
  interval: 10m
  path: ./apps/authelia
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: authelia
  serviceAccountName: authelia-sa
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
