apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/traefik-config
  prune: true
  dependsOn:
    - name: traefik
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: traefik
  serviceAccountName: traefik-sa
