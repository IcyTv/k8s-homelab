---
apiVersion: v1
kind: Namespace
metadata:
  name: paperless-ngx
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paperless-ngx-sa
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paperless-ngx-sa-admin
  namespace: paperless-ngx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: paperless-ngx-sa
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-ngx
  namespace: flux-system
spec:
  dependsOn:
    - name: base
    - name: smb
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: paperless-ngx
      namespace: paperless-ngx
  interval: 10m
  path: ./apps/paperless-ngx
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: paperless-ngx
  serviceAccountName: paperless-ngx-sa
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
