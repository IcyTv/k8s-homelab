apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smb
  namespace: flux-system
spec:
  dependsOn:
    - name: base
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: csi-driver-smb
      namespace: flux-system
  interval: 10m
  path: ./apps/smb
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
