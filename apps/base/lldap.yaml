---
apiVersion: v1
kind: Namespace
metadata:
  name: lldap
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lldap-sa
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lldap-sa-admin
  namespace: lldap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: lldap-sa
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lldap
  namespace: flux-system
spec:
  dependsOn:
    - name: base
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: lldap
      namespace: lldap
  interval: 10m
  path: ./apps/lldap
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: lldap
  serviceAccountName: lldap-sa
  timeout: 5m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
