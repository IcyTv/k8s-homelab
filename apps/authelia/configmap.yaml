apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.yml: |
    server:
      address: 'tcp://0.0.0.0:9091/oauth'
    log:
      level: 'info'
    totp:
      issuer: 'icytv.de'
    authentication_backend:
      ldap:
        implementation: 'lldap'
        address: 'ldap://lldap.lldap.svc.cluster.local:3890'
        base_dn: 'DC=icytv,DC=de'
        user: 'UID=admin,OU=people,DC=icytv,DC=de'
        password: '{{ secret "/secrets/lldap-admin-password" }}'
    access_control:
      default_policy: 'deny'
      rules:
        - domain: 'auth.icytv.de'
          resources:
            - '^/oauth([/?].*)?$'
            - '^/\.well-known([/?].*)?$'
          policy: 'bypass'
        - domain: '*.icytv.de'
          subject:
            - 'group:2fa'
          policy: 'two_factor'
        - domain: '*.icytv.de'
          policy: 'one_factor'
    session:
      secret: '{{ secret "/secrets/session-secret" }}'
      expiration: '12h'
      inactivity: '30m'
      remember_me: '14d'
      cookies:
        - domain: 'icytv.de'
          authelia_url: 'https://auth.icytv.de/oauth'
          default_redirection_url: 'https://cluster.icytv.de'
    regulation:
      max_retries: 5
      find_time: '2m'
      ban_time: '5m'
    storage:
      encryption_key: '{{ secret "/secrets/storage-encryption-key" }}'
      local:
        path: '/data/db.sqlite3'
    notifier:
      filesystem:
        filename: '/data/notifications.txt'
    identity_validation:
      reset_password:
        jwt_secret: '{{ secret "/secrets/jwt-secret" }}'
    identity_providers:
      oidc:
        hmac_secret: '{{ secret "/secrets/oidc-hmac-secret" }}'
        jwks:
          - key_id: 'default'
            algorithm: 'RS256'
            use: 'sig'
            key: {{ secret "/secrets/oidc-jwks-key.pem" | mindent 12 "|" | msquote }}
        cors:
          endpoints:
            - 'authorization'
            - 'token'
            - 'revocation'
            - 'introspection'
            - 'userinfo'
          allowed_origins:
            - 'https://cluster.icytv.de'
            - 'https://docs.icytv.de'
            - 'https://audiobook.icytv.de'
        authorization_policies:
          headlamp_policy:
            default_policy: 'deny'
            rules:
              - policy: 'two_factor'
                subject: 'group:2fa'
              - policy: 'one_factor'
                subject:
                  - 'group:cluster-admins'
                  - 'group:admins'
          client_policy:
            default_policy: 'one_factor'
            rules:
              - policy: 'two_factor'
                subject: 'group:2fa'
        clients:
          - client_id: 'CT7sh7bEIljUcAd8PxQjOJiBUflkywbhNJ1ZXaLE'
            client_name: 'Headlamp'
            client_secret: '$pbkdf2-sha512$310000$ySHTyLs9f3/IBfRqgpuoGg$HKg82pFkF1j5W0sXYiYPImFPxLAahKLd+vQZRCQKy1kzq1Ma+FGkgO0PAWlYsFLSpSYVSwrcDobItzxo9B4OrA'
            public: false
            authorization_policy: 'headlamp_policy'
            redirect_uris:
              - 'https://cluster.icytv.de/oidc-callback'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
              - 'groups'
            response_types:
              - 'code'
            grant_types:
              - 'authorization_code'
            token_endpoint_auth_method: 'client_secret_basic'

          - client_id: 'p0C1IEP67fwdvuYwyntruaY6N45hmZrYhVmdnnib'
            client_name: 'Paperless'
            client_secret: '$pbkdf2-sha512$310000$TlaL/eG337vYpwvW6C+KKA$cAI7QKsHoqrtIOjruhQH4I/zqOSYq7zwu2qPNW5WkkpTDDFJ7V8pM7SM4/0XUgtkroxsmduWXcTsuSXSKSlJjQ'
            public: false
            authorization_policy: 'client_policy'
            redirect_uris:
              - 'https://docs.icytv.de/accounts/openid_connect/authelia/login/callback/'
              - 'https://docs.icytv.de/accounts/openid_connect/authentik/login/callback/'
              - 'https://docs.icytv.de/accounts/authentik/login/callback/'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
              - 'groups'
            response_types:
              - 'code'
            grant_types:
              - 'authorization_code'
            token_endpoint_auth_method: 'client_secret_basic'

          - client_id: 'W05g2BNpNxhqJuzvcFSEh98KK8NDaTYaYOwhIdQ8'
            client_name: 'Audiobookshelf'
            client_secret: '$pbkdf2-sha512$310000$UH+mfZRlIf6k+5pe6NvHRQ$/0gzPjMAZYCbM3XbaY/aZ8uT2pUXjpCQ/KKuuTYOaax7ZSSA2XY8GfeJ8+mbUrPoOwHdelnxb8Yt35TwsOoEOA'
            public: false
            authorization_policy: 'client_policy'
            redirect_uris:
              - 'https://audiobook.icytv.de/auth/openid/callback'
              - 'https://audiobook.icytv.de/auth/openid/mobile-redirect'
              - 'audiobookshelf://oauth'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
            response_types:
              - 'code'
            grant_types:
              - 'authorization_code'
            token_endpoint_auth_method: 'client_secret_basic'
