apiVersion: v1
kind: ServiceAccount
metadata:
  name: homeassistant-backup-export
  namespace: homeassistant
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homeassistant-backup-export
  namespace: homeassistant
rules:
  - apiGroups: [volsync.backube]
    resources: [replicationsources]
    verbs: [create]
  - apiGroups: [volsync.backube]
    resources: [replicationsources]
    resourceNames: [homeassistant]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homeassistant-backup-export
  namespace: homeassistant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homeassistant-backup-export
subjects:
  - kind: ServiceAccount
    name: homeassistant-backup-export
    namespace: homeassistant
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homeassistant-backup-notifications
  namespace: homeassistant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: homeassistant
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              backups.homelab/component: homeassistant-export
      ports:
        - protocol: TCP
          port: 8123
