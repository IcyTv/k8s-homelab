apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 5m
  chart:
    spec:
      chart: traefik
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      version: "42.4.3"
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  releaseName: traefik
  targetNamespace: traefik
  values:
    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true

    ports:
      web:
        http: {}
        # Trust X-Forwarded-For from cloudflared pods so Home Assistant sees real client IPs.
        forwardedHeaders:
          trustedIPs:
            - 10.42.0.0/16
      websecure:
        http:
          middlewares:
            - traefik-forwarded-https@kubernetescrd

    service:
      spec:
        type: LoadBalancer
        # Preserve LAN client source IPs instead of SNAT to the node/svclb.
        externalTrafficPolicy: Local
