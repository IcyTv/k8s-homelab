apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: homeassistant
    app.kubernetes.io/part-of: homeassistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: homeassistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeassistant
    spec:
      securityContext:
        # The backup exporter reads this same local PVC.
        seLinuxOptions:
          level: s0
      initContainers:
        # Installs the pinned hass-oidc-auth release into /config/custom_components.
        # Bump OIDC_VERSION and OIDC_SHA256 together (sha256 of hass-oidc-auth.zip).
        - name: install-oidc-auth
          # Flux Image Automation marker references ImagePolicy flux-system:homeassistant
          image: "homeassistant/home-assistant:2026.11.3" # {"$imagepolicy": "flux-system:homeassistant"}
          imagePullPolicy: IfNotPresent
          env:
            - name: OIDC_VERSION
              value: "v1.2.1"
            - name: OIDC_SHA256
              value: "e5badaaacaa63cfd6fe733924a05e76d75058836190398598fb24de57cd47ccd"
          command:
            - python3
            - -c
            - |
              import hashlib, io, json, os, shutil, urllib.request, zipfile
              version, want = os.environ["OIDC_VERSION"], os.environ["OIDC_SHA256"]
              target = "/config/custom_components/auth_oidc"
              tmp = target + ".tmp"

              def installed():
                  try:
                      with open(target + "/manifest.json") as f:
                          return "v" + json.load(f)["version"].lstrip("v")
                  except Exception:
                      return None

              if installed() == version:
                  print("auth_oidc", version, "already installed")
                  raise SystemExit(0)
              try:
                  url = f"https://github.com/christiaangoossens/hass-oidc-auth/releases/download/{version}/hass-oidc-auth.zip"
                  data = urllib.request.urlopen(url, timeout=60).read()
                  got = hashlib.sha256(data).hexdigest()
                  if got != want:
                      raise RuntimeError(f"sha256 mismatch: {got} != {want}")
                  shutil.rmtree(tmp, ignore_errors=True)
                  os.makedirs(tmp)
                  zipfile.ZipFile(io.BytesIO(data)).extractall(tmp)
                  if not os.path.exists(tmp + "/__init__.py"):
                      raise RuntimeError("zip layout unexpected: no __init__.py at root")
                  shutil.rmtree(target, ignore_errors=True)
                  os.rename(tmp, target)
                  print("installed auth_oidc", version)
              except Exception as e:
                  shutil.rmtree(tmp, ignore_errors=True)
                  if installed() is not None:
                      # Never block Home Assistant startup when a working copy exists.
                      print("WARNING: could not update auth_oidc, keeping", installed(), ":", e)
                  else:
                      raise
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: homeassistant
          # Flux Image Automation marker references ImagePolicy flux-system:homeassistant
          image: "homeassistant/home-assistant:2026.11.3" # {"$imagepolicy": "flux-system:homeassistant"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          env:
            - name: TZ
              value: "Europe/Berlin"
            - name: HA_BACKUP_WEBHOOK_ID
              valueFrom:
                secretKeyRef:
                  name: storagebox-backup
                  key: HA_BACKUP_WEBHOOK_ID

          securityContext:
            privileged: true

          volumeMounts:
            - name: config
              mountPath: /config
            - name: zigbee-usb
              mountPath: /dev/zigbee
            - name: backup-notifications
              mountPath: /config/k8s_packages
              readOnly: true
          
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 120
            periodSeconds: 15

      volumes:
        - name: backup-notifications
          configMap:
            name: homeassistant-backup-notifications
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
        - name: zigbee-usb
          hostPath:
            path: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
            type: CharDevice
