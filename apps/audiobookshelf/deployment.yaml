apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  labels:
    app.kubernetes.io/name: audiobookshelf
    app.kubernetes.io/part-of: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: audiobookshelf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiobookshelf
    spec:
      containers:
        - name: audiobookshelf
          # Flux Image Automation marker references ImagePolicy flux-system:audiobookshelf
          image: advplyr/audiobookshelf:2.36.0 # {"$imagepolicy": "flux-system:audiobookshelf"}
          ports:
            - containerPort: 80
              name: http
          env:
            - name: AUDIOBOOKSHELF_UID
              value: "99"
            - name: AUDIOBOOKSHELF_GID
              value: "100"
            - name: TZ
              value: Europe/Berlin
          volumeMounts:
            - name: config
              mountPath: /config
            - name: audiobooks
              mountPath: /audiobooks
            - name: podcasts
              mountPath: /podcasts
            - name: metadata
              mountPath: /metadata
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: audiobookshelf-config
        - name: audiobooks
          persistentVolumeClaim:
            claimName: audiobookshelf-media
        - name: podcasts
          persistentVolumeClaim:
            claimName: audiobookshelf-podcasts
        - name: metadata
          persistentVolumeClaim:
            claimName: audiobookshelf-metadata
      securityContext:
        runAsUser: 99
        runAsGroup: 100
        supplementalGroups:
          - 1000
        fsGroup: 100
        fsGroupChangePolicy: Always
