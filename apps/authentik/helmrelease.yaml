apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  interval: 5m
  timeout: 15m
  chart:
    spec:
      chart: authentik
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
      version: "2026.8.5"
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  releaseName: authentik
  targetNamespace: authentik

  values:
    authentik:
      web:
        base_url: "https://auth.icytv.de"
    server:
      replicas: 1
      ingress:
        enabled: false
        hosts:
          - auth.icytv.de
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: secret-key
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgres
              key: password
    postgresql:
      enabled: true
      auth:
        existingSecret: authentik-postgres
        secretKeys:
          passwordKey: password
    worker:
      replicas: 1
      env:
        - name: AUTHENTIK_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: secret-key
              key: secret-key
        - name: AUTHENTIK_POSTGRESQL__PASSWORD
          valueFrom:
            secretKeyRef:
              name: authentik-postgres
              key: password
