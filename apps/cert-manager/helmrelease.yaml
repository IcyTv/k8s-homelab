apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m
  chart:
    spec:
      chart: cert-manager
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
      version: "v1.21.2"
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  releaseName: cert-manager
  targetNamespace: cert-manager
  values:
    crds:
      enabled: true
