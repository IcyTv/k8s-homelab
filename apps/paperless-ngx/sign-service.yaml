apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-sign-data
  namespace: paperless-ngx
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-sign-service
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-sign-service
    app.kubernetes.io/part-of: paperless-ngx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-sign-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-sign-service
    spec:
      hostAliases:
        - ip: "10.43.170.192"
          hostnames:
            - "auth.icytv.de"
      containers:
        - name: sign-service
          image: ghcr.io/bobber446/paperless-sign-service:latest
          ports:
            - containerPort: 8088
              name: http
          env:
            # Cluster-internal connection to Paperless-ngx
            - name: PAPERLESS_BASE_URL
              value: "http://paperless-ngx:80"
            - name: PAPERLESS_VERIFY_SSL
              value: "false"
            # Pre-shared API token matching Paperless sign-service user
            - name: PAPERLESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: oidc-secret
                  key: sign-service-token
          volumeMounts:
            # Preserves uploaded signatures, stamps, and profile settings
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-sign-data
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-sign-service
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-sign-service
    app.kubernetes.io/part-of: paperless-ngx
spec:
  selector:
    app.kubernetes.io/name: paperless-sign-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: paperless-ngx
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: paperless-sign-service
  namespace: paperless-ngx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns01
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/service.serversscheme: http
    # Authentik ForwardAuth middleware
    traefik.ingress.kubernetes.io/router.middlewares: paperless-ngx-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sign.docs.icytv.de
      secretName: paperless-sign-tls
  rules:
    - host: sign.docs.icytv.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: paperless-sign-service
                port:
                  number: 80
