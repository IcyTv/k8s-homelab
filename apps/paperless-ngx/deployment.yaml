apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  namespace: paperless-ngx
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/part-of: paperless-ngx
spec:
  replicas: 1
  # SQLite and local state must not be opened by overlapping rollout replicas.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-ngx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-ngx
    spec:
      # Start Redis before Paperless's blocking postStart hook can run.
      initContainers:
        - name: broker
          image: valkey/valkey:9-alpine
          restartPolicy: Always
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          startupProbe:
            exec:
              command: [valkey-cli, ping]
            periodSeconds: 2
            failureThreshold: 15
          volumeMounts:
            - name: redisdata
              mountPath: /data
      containers:
        - name: paperless-ngx
          image: paperlessngx/paperless-ngx:latest
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - name: Host
                  value: docs.icytv.de
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: PAPERLESS_REDIS
              value: redis://localhost:6379
            - name: PAPERLESS_DBENGINE
              value: sqlite
            # Keep background processing bounded on the 4 GB homelab node.
            - name: PAPERLESS_TASK_WORKERS
              value: "1"
            - name: PAPERLESS_THREADS_PER_WORKER
              value: "1"
            # The post-start Django script runs outside manage.py.
            - name: DJANGO_SETTINGS_MODULE
              value: paperless.settings
            - name: PAPERLESS_URL
              value: https://docs.icytv.de
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: secret-key
                  key: secret-key
            - name: PAPERLESS_CONSUMER_POLLING_INTERVAL
              value: "10"
            - name: PAPERLESS_CONSUMER_STABILITY_DELAY
              value: "10"
            # Allow OCR for digitally signed documents while preserving the original
            - name: PAPERLESS_OCR_USER_ARGS
              value: '{"invalidate_digital_signatures": true}'
            # OIDC Authentication with Authentik via django-allauth
            - name: PAPERLESS_APPS
              value: "allauth.socialaccount.providers.openid_connect"
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: "true"
            - name: PAPERLESS_REDIRECT_LOGIN_TO_SSO
              value: "true"
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS
              value: "true"
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_SUPERUSER_GROUP
              value: "admins"
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: oidc-secret
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: oidc-secret
                  key: client-secret
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              value: '{"openid_connect":{"SCOPE":["openid","profile","email","groups"],"APPS":[{"provider_id":"authelia","name":"Authelia","client_id":"$(OIDC_CLIENT_ID)","secret":"$(OIDC_CLIENT_SECRET)","settings":{"server_url":"https://auth.icytv.de/oauth"}}]}}'
            # Pre-shared API token for paperless-sign-service
            - name: SIGN_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: oidc-secret
                  key: sign-service-token
          lifecycle:
            postStart:
              exec:
                command:
                  - python3
                  - -u
                  - -c
                  - |
                    import os
                    import sqlite3
                    import time

                    # Poll the SQLite schema cheaply; load Django only once.
                    for attempt in range(30):
                        try:
                            with sqlite3.connect('file:/usr/src/paperless/data/db.sqlite3?mode=ro', uri=True, timeout=1) as db:
                                tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                            if {'auth_user', 'authtoken_token'} <= tables:
                                break
                        except sqlite3.Error:
                            pass
                        time.sleep(2)
                    else:
                        raise RuntimeError('Database migrations were not ready for token provisioning')

                    import django
                    django.setup()
                    from django.contrib.auth.models import User
                    from django.db import transaction
                    from rest_framework.authtoken.models import Token
                    with transaction.atomic():
                        user, _ = User.objects.get_or_create(username='sign-service', defaults={'is_superuser': True, 'is_staff': True, 'is_active': True})
                        Token.objects.filter(user=user).delete()
                        Token.objects.create(user=user, key=os.environ['SIGN_SERVICE_TOKEN'])
                    print('Sign-service API token provisioned successfully')
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: consume
              mountPath: /usr/src/paperless/consume
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-ngx-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-ngx-media
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-ngx-consume
        - name: redisdata
          persistentVolumeClaim:
            claimName: paperless-ngx-redisdata
        
