apiVersion: v1
kind: Pod
metadata:
  name: audiobookshelf-migration
spec:
  containers:
    - name: migration
      image: busybox:1.38
      command:
        - sh
        - -c
        - while true; do sleep 3600; done
      volumeMounts:
        - name: config
          mountPath: /config
        - name: metadata
          mountPath: /metadata
        - name: audiobooks
          mountPath: /audiobooks
        - name: podcasts
          mountPath: /podcasts
  volumes:
    - name: config
      persistentVolumeClaim:
        claimName: audiobookshelf-config
    - name: metadata
      persistentVolumeClaim:
        claimName: audiobookshelf-metadata
    - name: audiobooks
      persistentVolumeClaim:
        claimName: audiobookshelf-media
    - name: podcasts
      persistentVolumeClaim:
        claimName: audiobookshelf-podcasts
